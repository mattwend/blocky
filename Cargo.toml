[package]
name = "blocky"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = true }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
wasmtime = { version = "31", default-features = true }
