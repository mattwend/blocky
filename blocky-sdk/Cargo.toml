[package]
name = "blocky-sdk"
version = "1.0.0"
edition = "2024"
description = "Contract-side SDK for Blocky smart contracts"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/mattwend/blocky"
keywords = ["blockchain", "wasm", "smart-contracts", "sdk"]
categories = ["api-bindings", "wasm"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
talc = { version = "5", features = ["disable-grow-in-place"] }

[dev-dependencies]
serial_test = "3"
